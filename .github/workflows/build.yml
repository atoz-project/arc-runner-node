name: build

on:
  push:
    branches: [main]
    tags: ["*"]
    # 只有影响镜像内容的变更才触发完整镜像重建:docs/、deploy/、ADR 等纯
    # 文档/部署变更不值得重新构建(对齐 golang 仓库的做法;本仓库无
    # VERSION 文件,无需列入)。手动 workflow_dispatch 不受此过滤影响。
    paths: ["Dockerfile", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/atoz-project/arc-runner-node

jobs:
  build-and-push:
    # Public repo: GitHub-hosted runners are free here regardless of org billing.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image tags
        id: tags
        run: |
          # Immutable per-build tag: <node version>-<YYYYMMDD><run number>.
          echo "date_tag=$(date -u +%Y%m%d)${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Versions live in the Dockerfile ARGs (single source of truth); add a
          # matrix with build-args here when a second Node line appears.
          # No :latest tag by design: consumers pin an explicit line (or date tag).
          tags: |
            ${{ env.IMAGE }}:24
            ${{ env.IMAGE }}:24.21.0-${{ steps.tags.outputs.date_tag }}
          # Layer cache in the GitHub Actions cache backend; mode=max lets
          # later builds reuse every layer.
          cache-from: type=gha
          cache-to: type=gha,mode=max
