# arc-runner-set-node scale set 的 Helm values(chart gha-runner-scale-set)。
#
# 本文件是源事实(source of truth)。改动后用以下命令应用:
#   helm upgrade arc-runner-set-node \
#     oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
#     --version 0.14.2 -n arc-runners --kube-context k8s-sg-dev \
#     -f deploy/arc-runner-set-node.values.yaml
#
# 血泪教训(2026-09-10/11 事故,与 golang/rust 两个 set 相同):
# - --version 必须钉死,且次版本必须与 controller 一致(controller 为 0.14.2;
#   0.14.x chart 配 0.13.0 controller 曾静默丢 listener —— 2026-09-11 事故)。
# - 永远不要用过期的本文件副本做 upgrade:helm 会整体替换渲染后的 spec,
#   本文件与线上 CR 之间的任何漂移都会被回滚。
# - scale set 的名字就是 `runs-on` 标签:release 名 `arc-runner-set-node`
#   必须与消费方 workflow 的 runs-on 完全一致,差一个字符都匹配不上。
githubConfigSecret: github-config-secret
githubConfigUrl: https://github.com/atoz-project
minRunners: 1
namespaceOverride: ""
runnerGroup: arc-public
template:
  spec:
    # fsGroup 设为 runner 用户的 uid(1001),让挂载进来的缓存卷对 runner
    # 可写(与 arc-runner-golang 的约定一致)。
    securityContext:
      fsGroup: 1001
    # 单容器:无 docker-dind sidecar。no DinD 是本镜像的硬设计契约
    # (见 README "No DinD by design"),此处不得添加 dind。
    containers:
    - command: ["/home/runner/run.sh"]
      # 2026-09-18 抖动根因(通用 set 同名字段有完整记录):不显式设置
      # command 时 pod 走镜像默认 ENTRYPOINT,在 ECI 上不到 1 秒退出 0,
      # runner 二进制根本没启动,ERS 无限重建 pod(~15 秒一个)。
      # 原生 entrypoint + ECI = 必坏;永远显式设置 command。
      image: ghcr.io/atoz-project/arc-runner-node:24
      # 镜像 tag 约定与 golang/rust 不同(见 README):本仓库的 scale set
      # 固定消费浮动主版本 tag `:24`,不可变的 `:<node 版本>-<日期><run>`
      # tag 只用于钉版回滚。代价:浮动 tag 使 ECI ImageCache 对本 set 不适用
      # (ImageCache 按精确 name:tag 匹配,只认不可变 tag)——需要 ImageCache
      # 时把这里改成钉某个日期 tag。
      name: runner
      volumeMounts:
        # 缓存目录契约(见 README):npm(`npm_config_cache`)、pnpm/yarn
        # (corepack 默认)的缓存都收敛在 /home/runner/.cache 下,一个卷
        # 即可跨临时 runner pod 持久化全部缓存。
        - name: cache
          mountPath: /home/runner/.cache
      # 内存有已知下限:x-platform 的 web job(vite build,本 set 的未来消费方)
      # 在默认规格(2C/4Gi)的 ECI pod 上被 SIGKILL/OOM(见 x-platform PR #126),
      # 只有在 golang set 的 4C/8Gi pod 上才跑稳 —— 直接按 golang 的规格起步。
      # requests==limits → Guaranteed QoS,ECI 按 4C/8Gi 规格开实例。
      resources:
        requests: { cpu: "4", memory: 8Gi }
        limits:   { cpu: "4", memory: 8Gi }
      # 磁盘则不加 ECI 临时盘注解:golang 的 +20Gi 源于 go test -race 的
      # ENOSPC 事故,node 侧无对应证据;缓存走下面的 NFS 卷。真出现 ENOSPC 再加。
    volumes:
      # 共享缓存卷:阿里云 NAS 容量型(NFS),RWX,所有 runner pod 挂同一份
      # 缓存(设计依据见 arc-runner-golang docs/adr/0001)。集群是 ACK
      # Serverless、无任何 CSI driver,故用 in-tree nfs volume 直连挂载点,
      # 不建 PV/PVC。文件系统 071wrg7528z1wkkb61l(ap-southeast-1a,账号
      # security-labs,tag owner=arc-runner-node),挂载点在集群 VPC 的 1a
      # vSwitch。重建:aliyun nas CreateFileSystem + CreateMountTarget,
      # 然后把下面的 server 换成新挂载点域名。
      - name: cache
        nfs:
          server: 071wrg7528z1wkkb61l-fbj64.ap-southeast-1.nas.aliyuncs.com
          path: /
